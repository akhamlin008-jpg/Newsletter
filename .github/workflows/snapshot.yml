name: Morning data snapshot

# GitHub's scheduler is best-effort: runs get delayed at busy times and dropped
# under load. Yesterday and today, only one of ~15 scheduled attempts fired.
# So this asks the scheduler for ONE early start and then takes every snapshot
# from inside that single job, where the timing is ours. Extra start times are
# listed only so that a dropped start still leaves a later one.

on:
  schedule:
    - cron: "7 3 * * 1-5"       # first choice
      timezone: "America/New_York"
    - cron: "38 3 * * 1-5"      # backup if the first is dropped
      timezone: "America/New_York"
    - cron: "9 4 * * 1-5"       # last backup
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      slots:
        description: "Snapshot times (New York), space-separated. Empty = one snapshot now."
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 300          # job limit is 6 h; this window is under 4 h
    env:
      SLOTS: ${{ inputs.slots || '04:30 05:15 05:45 06:15 06:35' }}
      LATE_TOLERANCE_MIN: 15      # a slot this far past still runs; older is skipped
      MIN_SNAPSHOTS: 3            # fewer than this fails the job so GitHub emails you
    steps:
      # A dropped start means a backup start fires. If the earlier job is still
      # running, this one exits instead of duplicating its work.
      - name: Stand down if an earlier run is already working
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mine=${{ github.run_id }}
          others=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "${{ github.workflow }}" \
                     --status in_progress --json databaseId --jq '.[].databaseId' || echo "")
          for id in $others; do
            if [ "$id" -lt "$mine" ]; then
              echo "Run $id started earlier and is still going. Exiting."
              exit 1
            fi
          done
          echo "No earlier run in progress."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: pip install --upgrade yfinance

      - name: Take snapshots through the morning
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          taken=0; failed=0
          echo "Started $(TZ=America/New_York date '+%F %H:%M %Z'). Slots: $SLOTS"

          for t in $SLOTS; do
            if [ -n "$t" ]; then
              today=$(TZ=America/New_York date +%F)
              target=$(TZ=America/New_York date -d "$today $t" +%s)
              wait=$(( target - $(date +%s) ))
              if [ "$wait" -gt 0 ]; then
                echo "Waiting ${wait}s for $t ET"
                sleep "$wait"
              elif [ "$wait" -lt "-$(( LATE_TOLERANCE_MIN * 60 ))" ] && [ "$taken" -gt 0 ]; then
                echo "Skipping $t ET: more than ${LATE_TOLERANCE_MIN} min past."
                continue
              else
                echo "Running $t ET immediately (start was late)."
              fi
            fi

            stamp=$(TZ=America/New_York date '+%F %H:%M %Z')
            echo "::group::Snapshot $stamp"
            if timeout 300 python scripts/fetch_snapshot.py; then
              taken=$(( taken + 1 ))
              cp data/latest.md "data/snapshots/$(TZ=America/New_York date +%F).md"
              git add data
              if git diff --cached --quiet; then
                echo "Nothing changed."
              else
                git commit -q -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
                git push -q || { git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q; }
                echo "Committed."
              fi
            else
              failed=$(( failed + 1 ))
              echo "::warning::Snapshot at $stamp failed."
            fi
            echo "::endgroup::"
          done

          echo "Snapshots taken: $taken, failed: $failed"
          echo "SNAPSHOTS_TAKEN=$taken" >> "$GITHUB_ENV"

      # A silent miss is the failure mode that hurts, so make it loud: a failed
      # job sends GitHub's normal failure email.
      - name: Fail if the morning came up short
        run: |
          if [ "${SNAPSHOTS_TAKEN:-0}" -lt "$MIN_SNAPSHOTS" ]; then
            echo "::error::Only ${SNAPSHOTS_TAKEN:-0} snapshots, expected at least $MIN_SNAPSHOTS."
            exit 1
          fi
          echo "Morning complete: ${SNAPSHOTS_TAKEN} snapshots."
