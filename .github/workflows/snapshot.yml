name: Morning data snapshot

on:
  schedule:
    # 6:45 AM New York time, weekdays. The timezone field handles daylight
    # saving time. GitHub can still start scheduled runs late when busy.
    - cron: "45 6 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch: {}       # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: pip install --upgrade yfinance   # latest release picks up fixes when Yahoo changes

      - name: Fetch free data
        timeout-minutes: 4
        run: python scripts/fetch_snapshot.py

      - name: Save snapshot to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
